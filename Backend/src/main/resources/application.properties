spring.application.name=Backend

# --- Datasource (Postgres, no H2) ---
# Real-user rule: everything comes from env. No hardcoded passwords.
# Supports both Render (SPRING_DATASOURCE_*) and local docker (.env DB_*).
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/chatx}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.maximum-pool-size=10

# --- JPA ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.format_sql=false

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# --- Auth / Google / JWT ---
google.client-id=${GOOGLE_CLIENT_ID:}
jwt.secret=${JWT_SECRET:change-me-to-a-256-bit-secret-min-32-chars-long-please}
jwt.access-expiry-ms=${JWT_ACCESS_EXPIRY:900000}
jwt.refresh-expiry-ms=${JWT_REFRESH_EXPIRY:604800000}

# --- CORS ---
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}

# --- Storage ---
storage.type=${STORAGE_TYPE:local}
# Render mounts a persistent disk here (local plan) — plain env name on purpose.
storage.local.location=${STORAGE_LOCAL_LOCATION:./uploads}

# --- Uploads ---
spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
app.upload.max-bytes=26214400

# --- Auth cookie (secure=false for http://localhost, true for HTTPS prod) ---
app.cookie.secure=${COOKIE_SECURE:false}

server.port=${PORT:8080}
